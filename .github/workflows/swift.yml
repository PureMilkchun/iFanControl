name: macOS checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Check whitespace
      run: git diff --check origin/main...HEAD
    - name: Build release
      run: swift build -c release
    - name: Verify stable and Beta update contracts
      run: bash packaging/pkg/test_updates.sh
    - name: Verify native UI controllers
      run: python3 packaging/pkg/test_ui.py
    - name: Verify actual startup sequence
      run: python3 packaging/pkg/test_startup.py
    - name: Verify published Beta70 source baseline
      run: python3 scripts/verify_release_source.py docs/releases/2.9.10-beta.70.json --ref v2.9.10-beta.70
